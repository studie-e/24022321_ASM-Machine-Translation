[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["common", "translate_transformers", "translate_seq2seq", "scripts"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"translate_transformers/train.py" = ["E402"]
"translate_seq2seq/train.py" = ["E402"]
